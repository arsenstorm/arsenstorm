name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Each run is recorded as a deployment: production shows on the repo page,
    # and a pull request's preview link shows in its timeline.
    environment:
      name: ${{ github.event_name == 'push' && 'arsenstorm.com' || 'preview' }}
      url: ${{ github.event_name == 'push' && 'https://arsenstorm.com' || steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # OG videos are keyed by a hash of what they draw, so only changed pages
      # are re-recorded. Each run saves a new entry; restore picks the latest.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/og-videos
          key: og-videos-${{ github.run_id }}
          restore-keys: og-videos-
      # ffmpeg only records videos, and most runs reuse every one from the
      # cache, so it is installed (about 30s) only when a run fails without it.
      - run: |
          bun run generate:og || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
            bun run generate:og
          }
      # Saved straight away, so a failed deploy keeps the new recordings.
      - uses: actions/cache/save@v4
        with:
          path: .cache/og-videos
          key: og-videos-${{ github.run_id }}
      - name: Deploy to production
        if: github.event_name == 'push'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          # Best-effort: until the v2 Durable Object deletion migration has been
          # applied by a production deploy, version uploads are rejected (10211).
          bunx wrangler versions upload 2>&1 | tee version-upload.log || true
          PREVIEW_URL="$(grep -Eo 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' version-upload.log | head -1)"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            echo "${PREVIEW_URL:-_No preview URL was generated for this version._}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
