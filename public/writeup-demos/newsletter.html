<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<meta content="light dark" name="color-scheme">
		<title>Newsletter widget</title>
		<style>
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				margin: 0;
				font:
					12px InterVariable,
					ui-sans-serif,
					system-ui,
					sans-serif;
				color: #171717;
				background: transparent;
			}
			form {
				display: flex;
				gap: 8px;
				align-items: center;
				padding: 12px;
			}
			input {
				box-sizing: border-box;
				height: 32px;
				padding: 0 10px;
				font: inherit;
				color: inherit;
				background: transparent;
				border: 1px solid #d4d4d4;
				border-radius: 6px;
			}
			button {
				height: 32px;
				padding: 0 12px;
				font: inherit;
				font-weight: 500;
				color: #fafafa;
				cursor: pointer;
				background: #171717;
				border: 0;
				border-radius: 6px;
			}
			[hidden] {
				display: none;
			}
			@media (prefers-color-scheme: dark) {
				body {
					color: #fafafa;
				}
				input {
					border-color: #404040;
				}
				button {
					color: #171717;
					background: #f5f5f5;
				}
			}
		</style>
	</head>
	<body>
		<!-- The same-origin iframe target for the automating-browser-workflows
         write-up: a working subscribe widget the extension can record and
         replay inside this frame's own document. -->
		<form id="frame-newsletter">
			<label for="frame-email" hidden>Email</label>
			<input
				autocomplete="off"
				id="frame-email"
				placeholder="you@example.com"
				type="email"
			>
			<button id="frame-subscribe" type="submit">Subscribe</button>
		</form>
		<p hidden id="frame-done">Subscribed ✓</p>
		<script>
			"use strict";
			const form = document.getElementById("frame-newsletter");
			const done = document.getElementById("frame-done");
			form.addEventListener("submit", (event) => {
				event.preventDefault();
				form.hidden = true;
				done.hidden = false;
			});
		</script>
	</body>
</html>
